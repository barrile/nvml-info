[project]
name = "nvml-info"
version = "0.1.0"
description = "Thin wrapper around pynvml for discovering and querying NVIDIA GPUs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Thiago Barrile", email = "thiago@explorance.com" }
]
license = { text = "MIT" }
keywords = ["nvidia", "gpu", "cuda", "nvml", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.11.7",
    "nvidia-ml-py>=12.575.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/nvml-info"
Documentation = "https://github.com/yourusername/nvml-info#readme"
Repository = "https://github.com/yourusername/nvml-info"
Issues = "https://github.com/yourusername/nvml-info/issues"

[tool.uv.build-backend]
module-name = "nvml_info"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ["py312", "py313"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
